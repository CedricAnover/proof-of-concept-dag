version: '3'

silent: true

tasks:
  default:
    cmds:
      - task: clean
      - task: run-samples-parallel

  clean:
    cmds:
      - rm -rf /tmp/dag*
      - rm -rf /tmp/node*
      - rm -rf ./.tmp

  sample-1:
    cmds:
      - python -B sample_1.py

  sample-2:
    cmds:
      - python -B sample_2.py

  sample-3:
    cmds:
      - python -B sample_3.py
  
  sample-4:
    cmds:
      - python -B sample_4.py

  run-samples-parallel:
    deps: [sample-1, sample-2, sample-3, sample-4]
    cmds:
      - echo "Taskfile Parallel Done!!!"
      - task: clean
