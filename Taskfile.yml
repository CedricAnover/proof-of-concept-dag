version: '3'

silent: true

###############################################################################
tasks:
  default:
    cmds:
      - task: clean
#==============================================================================
  test:
    cmds:
      - python -m unittest discover -s tests -p 'test_*.py'
#==============================================================================
  clean:
    cmds:
      - task: clean-samples
      - task: clean-py

  clean-samples:
    cmds:
      - rm -rf /tmp/dag*
      - rm -rf /tmp/node*
      - rm -rf ./.tmp

  clean-py:
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type d -name "*.pytest_cache" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete
#==============================================================================

  run-*:
    summary: |
      Usage Example: 
        `task run-sample_node` - Runs `python -B sample_node.py`
    vars:
      SAMPLE: '{{index .MATCH 0}}'
    cmds:
      - defer: { task: clean }
      - python -B {{.SAMPLE}}.py

#==============================================================================
